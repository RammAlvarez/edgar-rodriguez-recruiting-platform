# Local environment (npm run db:up): Postgres 18, MinIO (S3-compatible) and the scheduler.
# Host ports default to the documented ones and can be moved in the repo-root .env when they are taken.
name: recruiting-platform

services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PLATFORM_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./roles.sql:/docker-entrypoint-initdb.d/roles.sql.inc:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Upstream minio/minio images are no longer published (Docker Hub and Quay); the frozen Bitnami build is the same
  # server and is used for local development only (PLAN D54). Buckets are private and created at start-up.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: documents,exports
    ports:
      - "${PLATFORM_S3_PORT:-9000}:9000"
      - "${PLATFORM_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  scheduler:
    build: ../services/scheduler
    environment:
      API_URL: ${SCHEDULER_API_URL:-http://host.docker.internal:5080}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-change-me-0123456789}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  minio-data:
